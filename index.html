<script>
const $=s=>document.querySelector(s);

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- IndexedDB ---------- */

function build(name,map){
 const m2={};for(const k of Object.keys(map)){const n=norm(k);if(n&&!/(^|\/)(__MACOSX|\.DS_Store)(\/|$)/.test(n))m2[n]=map[k]}
 let ks=Object.keys(m2);
 if(ks.length&&ks.every(k=>k.includes('/'))&&new Set(ks.map(k=>k.split('/')[0])).size===1){const r={};ks.forEach(k=>r[k.slice(k.indexOf('/')+1)]=m2[k]);ks=Object.keys(r);return fin(name,r,ks)}
 return fin(name,m2,ks)}
function fin(name,m,ks){
 const htmls=ks.filter(k=>/\.html?$/i.test(k));if(!htmls.length)throw new Error('nohtml');
 const main=ks.includes('index.html')?'index.html':htmls.sort((a,b)=>a.split('/').length-b.split('/').length||a.length-b.length)[0];
 const files={};ks.forEach(k=>files[k]=m[k] instanceof Blob?m[k]:new Blob([m[k]],{type:mime(k)}));
 return {id:uid(),name,fid:null,main,created:Date.now(),files}}
async function importFiles(fl){
 fl=[...fl];if(!fl.length)return;let n=0;const fid=curF();
 const add=async p=>{p.fid=fid;await put('p',p);n++};
 try{
  if(fl[0].webkitRelativePath){const m={};fl.forEach(f=>m[f.webkitRelativePath]=f);await add(build(fl[0].webkitRelativePath.split('/')[0],m))}
  else for(const f of fl){
   const base=f.name.replace(/\.[^.]+$/,'');
   try{
    if(/\.zip$/i.test(f.name))await add(build(base,await readZip(await f.arrayBuffer())));
    else if(/\.html?$/i.test(f.name))await add(build(base,{'index.html':f}));
    else toast(L('نوع غير مدعوم: ','Unsupported: ')+f.name)}
   catch(e){toast(e.message==='nohtml'?L('لا يوجد ملف HTML داخل ','No HTML file in ')+f.name:e.message==='method'?L('طريقة ضغط غير مدعومة في ','Unsupported compression in ')+f.name:L('ملف ZIP تالف أو غير صالح: ','Invalid ZIP: ')+f.name);console.error(e)}}
 }catch(e){toast(e.message==='nohtml'?L('لا يوجد ملف HTML داخل المجلد','No HTML file in folder'):L('فشل الاستيراد','Import failed'));console.error(e)}
 if(n)toast(L('تم استيراد ','Imported ')+n+L(' مشروع',' project(s)'));render()}

 fl.forEach((f,i)=>{const e=ext(f.name)||'jpg',k='img-'+(i+1)+'.'+e;m[k]=new Blob([f],{type:f.type||mime(k)});h+=`<img src="${k}" alt="">`});
 m['index.html']=new Blob([`<!doctype html>\n<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(name)}</title><style>body{margin:0;background:#111;text-align:center}img{max-width:100%;display:block;margin:12px auto}</style></head><body>${h}</body></html>`],{type:'text/html'});

 d.querySelector('#pc').onclick=()=>d.close();d.querySelector('#ps').onclick=async()=>{const n=d.querySelector('#pn').value.trim(),t=d.querySelector('#pt').value;if(!n||!t.trim())return toast(L('اكتب الاسم والكود','Enter a name and code'));const p=build(n,{'index.html':new Blob([t],{type:'text/html'})});p.fid=curF();await put('p',p);d.close();toast(L('تم الحفظ','Saved'));render()}}
/* ---------- Export ---------- */
async function icon(txt,s){const c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,s,s);g.addColorStop(0,'#2e7d4a');g.addColorStop(1,'#0a3318');x.fillStyle=g;x.fillRect(0,0,s,s);x.fillStyle='#b8f2a3';x.font=`bold ${s*.45}px sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText([...txt][0]?.toUpperCase()||'I',s/2,s*.54);return new Promise(r=>c.toBlob(async b=>r(await u8(b)),'image/png'))}
async function entries(p,base,pwa){
 const out=[],map={};
 for(const k of Object.keys(p.files))map[k]=await u8(p.files[k]);
 const top=p.main.includes('/')?null:p.main;
 if(!map['index.html']){
  if(top)map['index.html']=map[p.main];
  else map['index.html']=new TextEncoder().encode(`<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=${encodeURI(p.main)}"><a href="${encodeURI(p.main)}">${esc(p.name)}</a>`)}
 if(pwa){
  let h=new TextDecoder().decode(map['index.html']);
  const head=`<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0a3318"><link rel="apple-touch-icon" href="icon-192.png">`,sc=`<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js')<\/script>`;
  if(!/rel=["']?manifest/i.test(h))h=/<\/head>/i.test(h)?h.replace(/<\/head>/i,head+'</head>'):head+h;
  h=/<\/body>/i.test(h)?h.replace(/<\/body>/i,sc+'</body>'):h+sc;
  map['index.html']=new TextEncoder().encode(h);
  map['icon-192.png']=await icon(p.name,192);map['icon-512.png']=await icon(p.name,512);
  map['manifest.webmanifest']=new TextEncoder().encode(JSON.stringify({name:p.name,short_name:p.name.slice(0,12),start_url:'./',scope:'./',display:'standalone',background_color:'#0a3318',theme_color:'#0a3318',icons:[{src:'icon-192.png',sizes:'192x192',type:'image/png',purpose:'any maskable'},{src:'icon-512.png',sizes:'512x512',type:'image/png',purpose:'any maskable'}]},null,2));
  const fl=['./',...Object.keys(map).map(k=>'./'+k.split('/').map(encodeURIComponent).join('/'))];
  map['service-worker.js']=new TextEncoder().encode(`const C='pwa-${Date.now()}';const F=${JSON.stringify(fl)};\nconst clean=async r=>{if(!r.redirected)return r;const b=await r.blob();return new Response(b,{status:r.status,statusText:r.statusText,headers:r.headers})};\nself.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>Promise.all(F.map(async u=>{try{const r=await fetch(u,{cache:'reload'});if(r.ok)await c.put(u,await clean(r))}catch(_){}}))));self.skipWaiting()});\nself.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!==C).map(x=>caches.delete(x)))));self.clients.claim()});\nself.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;if(e.request.mode==='navigate')e.respondWith(fetch(e.request).catch(()=>caches.match('./')));else e.respondWith(caches.match(e.request,{ignoreSearch:true}).then(r=>r||fetch(e.request)))});`)}
 for(const k of Object.keys(map))out.push({n:base+'/'+k,d:map[k]});
 return out}
async function exp(p,pwa){toast(L('جارٍ التصدير…','Exporting…'));dl(await makeZip(await entries(p,safe(p.name)||'project',pwa)),(safe(p.name)||'project')+(pwa?'-pwa':'')+'.zip')}
async function exportMany(ids,name,skip){
 const ps=ids?P.filter(p=>ids.includes(p.fid)):P;if(!ps.length)return toast(L('لا توجد مشاريع للتصدير','Nothing to export'));
 toast(L('جارٍ التجهيز…','Preparing…'));const used=new Set(),list=[];
 for(const p of ps){const base=pBase(p,Math.max(0,skip));let x=base,i=2;while(used.has(x))x=base+'-'+i++;used.add(x);list.push(...await entries(p,x,false))}
 dl(await makeZip(list),(safe(name)||'export')+'.zip')}
/* ---------- Preview ---------- */
function resolve(from,ref){if(!ref||/^([a-z][a-z0-9+.-]*:|\/\/|#)/i.test(ref))return null;let r=ref.split('#')[0].split('?')[0];try{r=decodeURIComponent(r)}catch{}
 const parts=(r.startsWith('/')?r:from.replace(/[^/]*$/,'')+r).split('/'),o=[];for(const s of parts){if(s==='..')o.pop();else if(s&&s!=='.')o.push(s)}return o.join('/')}
async function preview(p){
 const urls={},tmp=[],mk=(b,t)=>{const u=URL.createObjectURL(b.slice(0,b.size,t||b.type));tmp.push(u);return u};
 for(const k of Object.keys(p.files))if(!/\.(css|html?)$/i.test(k))urls[k]=mk(p.files[k],mime(k));
 const cssFix=(t,from)=>t.replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g,(m,q,u)=>{const r=resolve(from,u);return r&&urls[r]?`url("${urls[r]}")`:m});
 for(const k of Object.keys(p.files))if(/\.css$/i.test(k))urls[k]=mk(new Blob([cssFix(await p.files[k].text(),k)]),'text/css');
 const doc=new DOMParser().parseFromString(await p.files[p.main].text(),'text/html');
 doc.querySelectorAll('[src],link[href]').forEach(el=>{const at=el.hasAttribute('src')?'src':'href',r=resolve(p.main,el.getAttribute(at));if(r&&urls[r])el.setAttribute(at,urls[r])});
 doc.querySelectorAll('style').forEach(s=>s.textContent=cssFix(s.textContent,p.main));
 doc.querySelectorAll('[style]').forEach(el=>el.setAttribute('style',cssFix(el.getAttribute('style'),p.main)));
 doc.querySelectorAll('[srcset]').forEach(el=>el.setAttribute('srcset',el.getAttribute('srcset').split(',').map(s=>{const [u,...r]=s.trim().split(/\s+/),x=resolve(p.main,u);return (x&&urls[x]||u)+(r.length?' '+r.join(' '):'')}).join(', ')));
 const src=mk(new Blob(['<!doctype html>'+doc.documentElement.outerHTML]),'text/html');
 const d=modal(`<div class="tp"><b>${esc(p.name)}</b><button class="b" id="cl">${ic('x')}${L('إغلاق','Close')}</button></div><iframe sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin" src="${src}"></iframe>`,'pv');
 d.querySelector('#cl').onclick=()=>d.close();d.addEventListener('close',()=>tmp.forEach(u=>URL.revokeObjectURL(u)))}
/* ---------- Files & editor ---------- */
async function files(p){
 const d=modal('');
 const draw=()=>{const ks=Object.keys(p.files).sort();
  d.querySelector('.mb').innerHTML=`<h3>${esc(p.name)}</h3><div class="row" style="margin:0 0 8px"><button class="b" id="af">${ic('plus')}${L('إضافة ملفات','Add files')}</button><button class="b" id="ad">${ic('files')}${L('إضافة مجلد','Add folder')}</button><button class="b g" id="cl">${ic('x')}${L('إغلاق','Close')}</button></div>`+ks.map((k,i)=>`<div class="f"><span>${esc(k)} ${k===p.main?'★':''}<br><small>${fsize(p.files[k].size)}</small></span>${isText(k)?`<button class="b" data-e="${i}">${ic('edit')}</button>`:''}${/\.html?$/i.test(k)&&k!==p.main?`<button class="b" data-m="${i}">★</button>`:''}<button class="b" data-d="${i}">${ic('trash')}</button></div>`).join('');
  const q=s=>d.querySelector(s);q('#cl').onclick=()=>{d.close();render()};
  q('#af').onclick=()=>pick('#fa');q('#ad').onclick=()=>pick('#fd2');
  d.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>edit(ks[b.dataset.e]));
  d.querySelectorAll('[data-m]').forEach(b=>b.onclick=async()=>{p.main=ks[b.dataset.m];await put('p',p);toast(L('تم تعيين الصفحة الرئيسية (تُصدَّر كـ index.html)','Main page set (exported as index.html)'));draw()});
  d.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{const k=ks[b.dataset.d];if(k===p.main)return toast(L('لا يمكن حذف الصفحة الرئيسية','Cannot delete the main page'));delete p.files[k];await put('p',p);draw()})};
 const pick=sel=>{const i=$(sel);i.onchange=async e=>{const arr=[...e.target.files];e.target.value='';let prefix='';if(sel==='#fa'){const r=await ask(L('المجلد داخل المشروع (اختياري)','Folder inside project (optional)'),[['f','','','images']],L('إضافة','Add'));if(!r)return;prefix=norm(r.f||'')}
  for(const f of arr){const rel=f.webkitRelativePath?f.webkitRelativePath.split('/').slice(1).join('/'):f.name;p.files[norm((prefix?prefix+'/':'')+rel)]=new Blob([f],{type:mime(f.name)})}
  await put('p',p);toast(L('تمت الإضافة','Added'));draw()};i.click()};
 draw();
 async function edit(k){const t=await p.files[k].text();const e=modal(`<h3>${esc(k)}</h3><textarea id="ta"></textarea><div class="row"><button class="b g" id="sv">${L('حفظ','Save')}</button><button class="b" id="cc">${L('إلغاء','Cancel')}</button></div>`);
  e.querySelector('#ta').value=t;e.querySelector('#cc').onclick=()=>e.close();
  e.querySelector('#sv').onclick=async()=>{p.files[k]=new Blob([e.querySelector('#ta').value],{type:mime(k)});await put('p',p);toast(L('تم الحفظ','Saved'));e.close();draw()}}}
applyCfg();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
migrate().catch(console.error).then(render);
</script>
